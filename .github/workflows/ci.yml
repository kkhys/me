name: CI

# Runs on pull requests and inside the merge queue only. A push to main does
# not re-run these checks: every change reaches main through a checked PR, the
# memo deploy re-gates itself in deploy-memo.yml, and me is built locally
# before its manual deploy. There is deliberately no opt-out label: a skipped
# required check counts as passing, which would let auto-merge land an
# unchecked PR.
on:
  pull_request:
    branches: ["*"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Test, Type check & Build
    runs-on: ubuntu-latest
    # Verify the code against fixtures and skip the heavy content submodules.
    # Every app reads USE_FIXTURE_DATA, so one env var switches the whole
    # workspace to fixtures. Real content errors are caught at deploy time.
    # See src/__fixtures__.
    env:
      USE_FIXTURE_DATA: "true"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/setup

      - name: Lint
        run: pnpm lint

      # `coverage` runs the full test suite and enforces each package's
      # coverage thresholds (vitest.config.ts), so a separate `test` step
      # would only duplicate the run.
      - name: Test & Coverage
        run: pnpm coverage

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build
