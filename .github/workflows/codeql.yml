name: CodeQL

# Advanced setup instead of GitHub's default setup: default setup never runs
# on merge_group, so the "Require code scanning results" rule on main could
# not be satisfied inside the merge queue. This mirrors what default setup
# ran (the same languages, the default query suite, a weekly schedule) and
# adds merge_group. Unlike ci.yml it also runs on push to main: code scanning
# needs an analysis of main to classify a PR's alerts as new or pre-existing.
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  schedule:
    - cron: "0 18 * * 0" # Mondays 03:00 JST

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
