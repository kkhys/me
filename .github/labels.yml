# Inherits the shared base label set (Conventional Commits types,
# type: bump-version):
# https://github.com/kkhys/.github/blob/main/.github/labels.yml
extends: kkhys/.github

# Repository-specific labels
labels:
  - name: "type: submodule"
    description: "Submodule update"
    color: "#d6e8ff"
  # A skipped required check counts as passing, so a CI opt-out label would
  # let auto-merge land an unchecked PR. ci.yml no longer honours the label.
  - name: "skip-ci"
    delete: true
