minimumReleaseAge: 1440

# Content submodules (apps/*/*-content) are intentionally NOT workspace members.
# They are separate repos with their own authoring tooling (lefthook, scrub-exif,
# bun scripts) and their own lockfiles; CI builds the apps against fixtures with
# the submodules absent. Listing them here made the root lockfile churn on every
# local `pnpm i`, because Renovate/CI regenerate it without the submodules
# checked out while local installs re-add their importer entries.
packages:
  - apps/*
  - packages/*

catalog:
  "@astrojs/check": 0.9.12
  "@astrojs/markdown-remark": 7.3.5
  "@astrojs/react": 7.1.2
  "@astrojs/sitemap": 3.7.4
  "@playform/compress": 0.2.5
  "@playwright/test": 1.64.1
  "@types/bun": 1.4.4
  "@types/mdast": 4.0.4
  "@types/react": 19.3.0
  "@vitest/coverage-v8": 5.0.5
  astro: 7.4.4
  astro-pagefind: 2.0.1
  budoux: 0.10.1
  fetch-site-metadata: 0.2.0
  kiso.css: 1.2.4
  linkedom: 0.18.14
  mdast-util-to-string: 4.0.0
  oxfmt: 0.75.0
  oxlint: 1.90.0
  react: 19.3.1
  react-dom: 19.3.1
  remark: 15.0.1
  satori: 0.63.2
  sharp: 0.35.5
  typescript: 6.0.3
  ulid: 3.0.2
  unist-util-visit: 5.2.0
  vitest: 5.0.5
  wrangler: 4.155.0
  yaml: 2.9.1

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
