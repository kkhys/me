minimumReleaseAge: 1440

# Content submodules (apps/*/*-content) are intentionally NOT workspace members.
# They are separate repos with their own authoring tooling (lefthook, scrub-exif,
# bun scripts) and their own lockfiles; CI builds the apps against fixtures with
# the submodules absent. Listing them here made the root lockfile churn on every
# local `pnpm i`, because Renovate/CI regenerate it without the submodules
# checked out while local installs re-add their importer entries.
packages:
  - apps/*
  - packages/*

catalog:
  "@astrojs/check": 0.9.12
  "@astrojs/markdown-remark": 7.3.8
  "@astrojs/react": 7.1.8
  "@astrojs/sitemap": 3.7.4
  "@playform/compress": 0.2.5
  "@playwright/test": 1.65.0
  "@types/bun": 1.4.4
  "@types/mdast": 4.0.4
  "@types/react": 19.3.0
  "@vitest/coverage-v8": 5.1.0
  astro: 7.4.11
  astro-pagefind: 2.0.1
  budoux: 0.10.3
  fetch-site-metadata: 0.2.0
  kiso.css: 1.2.4
  linkedom: 0.18.15
  mdast-util-to-string: 4.0.0
  oxfmt: 0.78.0
  oxlint: 1.93.0
  react: 19.3.1
  react-dom: 19.3.1
  remark: 15.0.1
  satori: 0.63.2
  sharp: 0.35.5
  typescript: 6.0.3
  ulid: 3.0.2
  unist-util-visit: 5.2.0
  vitest: 5.1.0
  wrangler: 4.162.0
  yaml: 2.9.1

# @astrojs/astro2tsx (pulled in by @astrojs/check) runs as wasm through
# @napi-rs/wasm-runtime but never declares that package's @emnapi/runtime peer,
# so pnpm fills the peer from whatever version is in the graph. Once rolldown's
# wasm binding brought @emnapi/runtime 2.x in, the 2.x runtime paired with
# astro2tsx's pinned @emnapi/core 1.11.3 threw on load and `astro check` could
# not import @astrojs/check. Keep the runtime on the core version astro2tsx pins.
# shortcut: keyed to astro2tsx 0.1.3, re-check (or drop) when it is bumped or
# declares @emnapi/runtime itself.
packageExtensions:
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      "@emnapi/runtime": 1.11.3

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
